<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meog Holdings · ERP</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Meog Holdings</h1>
        <p class="muted">Inventory · Customers · Orders</p>
      </div>
      <button id="refresh" type="button" class="ghost">Refresh</button>
    </header>

    <div id="alert" class="alert" role="status" hidden></div>

    <main>
      <section class="cards" id="stats" aria-label="Business summary"></section>

      <div class="grid">
        <section class="panel">
          <h2>Products</h2>
          <form id="product-form" class="stack" autocomplete="off">
            <input name="sku" placeholder="SKU" required />
            <input name="name" placeholder="Product name" required />
            <input name="unitPrice" type="number" step="0.01" min="0" placeholder="Unit price" required />
            <input name="stock" type="number" min="0" step="1" placeholder="Stock" value="0" required />
            <button type="submit">Add product</button>
          </form>
          <table>
            <thead>
              <tr>
                <th>SKU</th>
                <th>Name</th>
                <th class="num">Price</th>
                <th class="num">Stock</th>
              </tr>
            </thead>
            <tbody id="products-body"></tbody>
          </table>
        </section>

        <section class="panel">
          <h2>Customers</h2>
          <form id="customer-form" class="stack" autocomplete="off">
            <input name="name" placeholder="Customer name" required />
            <input name="email" type="email" placeholder="Email (optional)" />
            <button type="submit">Add customer</button>
          </form>
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody id="customers-body"></tbody>
          </table>
        </section>
      </div>

      <section class="panel">
        <h2>New order</h2>
        <form id="order-form" class="inline" autocomplete="off">
          <select name="customerId" id="order-customer" required></select>
          <select name="productId" id="order-product" required></select>
          <input name="qty" type="number" min="1" step="1" value="1" required />
          <button type="submit">Create order</button>
        </form>
        <p class="muted">Stock is checked and reduced automatically when the order is confirmed.</p>

        <table>
          <thead>
            <tr>
              <th>Order</th>
              <th>Customer</th>
              <th>Items</th>
              <th class="num">Total</th>
            </tr>
          </thead>
          <tbody id="orders-body"></tbody>
        </table>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
