<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meog ERP</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">M</span>
          <span>
            <strong>Meog ERP</strong>
            <small>Meog Holdings</small>
          </span>
        </div>
        <nav class="nav">
          <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
          <a href="#/products" data-nav="products">Products</a>
          <a href="#/sales" data-nav="sales">Sales orders</a>
          <a href="#/purchases" data-nav="purchases">Purchase orders</a>
          <a href="#/invoices" data-nav="invoices">Invoices</a>
          <a href="#/customers" data-nav="customers">Customers</a>
          <a href="#/suppliers" data-nav="suppliers">Suppliers</a>
          <a href="#/stock" data-nav="stock">Stock ledger</a>
          <a href="#/reports" data-nav="reports">Reports</a>
        </nav>
        <div class="sidebar-foot">
          <button type="button" class="ghost" data-action="refresh">Refresh data</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1 id="view-title">Dashboard</h1>
            <p id="view-subtitle" class="muted">Business overview</p>
          </div>
          <div class="topbar-actions" id="topbar-actions"></div>
        </header>
        <div id="toast" class="toast" hidden></div>
        <section id="view" class="view" aria-live="polite">
          <p class="muted">Loading…</p>
        </section>
      </main>
    </div>

    <dialog id="modal" class="modal">
      <div id="modal-body"></div>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
